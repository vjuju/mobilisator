<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - #RIENSANSNOUS</title>
    <link rel="icon" href="/assets/LogoOEP.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/LogoOEP.png">
    <style>
        @font-face {
            font-family: 'Folsom';
            src: url('/fonts/Folsom-Black.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        .navbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 24px;
            flex-shrink: 0;
        }

        .navbar h1 {
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .navbar h1 a {
            color: #fff;
            text-decoration: none;
        }

        .navbar h1 a:hover {
            color: #5ECBA1;
        }

        .navbar-logo {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: block;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1><a href="/">#RIENSANSNOUS</a></h1>
        <img src="/assets/LogoOEP.png" alt="On Est Prêt" class="navbar-logo">
        <div></div>
    </nav>

    <iframe src="https://onestpret.notion.site/ebd/31886e57ca1b80308ecdde71e807abf7"
            allowfullscreen
            title="FAQ"></iframe>

    <script>
      var _paq = window._paq = window._paq || [];
      _paq.push(['disableCookies']);
      _paq.push(['setDoNotTrack', true]);
      _paq.push(['trackPageView']);
      (function() {
        var u = "/a/";
        _paq.push(['setTrackerUrl', u + 'collect']);
        _paq.push(['setSiteId', '1']);
        var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
        g.async = true; g.src = u + 'js'; s.parentNode.insertBefore(g, s);
      })();
    </script>
</body>
</html>
