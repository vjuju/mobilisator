<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#RIENSANSNOUS - Municipales 2020</title>
    <meta property="og:title" content="#RIENSANSNOUS - Municipales 2020">
    <meta property="og:description" content="Découvre combien de jeunes auraient pu faire la diff' aux municipales 2020 dans ta ville.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        @font-face {
            font-family: 'Folsom';
            src: url('/fonts/Folsom-Black.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Folsom', Impact, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
        }

        /* ── Navbar ── */
        .navbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 24px;
        }

        .navbar-brand {
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .navbar-logo {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: block;
        }

        /* ── Main layout ── */
        #mainContent {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        /* ── Container ── */
        .container {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 20px 0;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* ── City detail container ── */
        #cityDetail {
            flex: 1;
            min-height: 0;
            container-type: size;
            container-name: city;
        }

        /* ── Search ── */
        .search-box {
            position: relative;
            flex-shrink: 0;
            margin: 0 auto 24px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            background: #5ECBA1;
            border-radius: 50px;
            padding: 18px 30px;
            cursor: text;
            box-shadow: 6px 6px 0 0 #fff;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 22px;
            font-weight: 400;
            color: #000;
            outline: none;
            width: 100%;
            text-align: center;
        }

        .search-input::placeholder {
            color: rgba(0, 0, 0, 0.55);
        }

        .results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-radius: 15px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
            text-align: left;
        }

        .results:empty {
            display: none;
        }

        .result-item {
            padding: 15px 25px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #333;
        }

        .result-item:hover {
            background: #2a2a2a;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item h3 {
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #5ECBA1;
            margin-bottom: 0;
        }

        /* ── Landing text ── */
        .landing-text {
            text-align: center;
            padding: 0 8px;
        }

        .landing-text p {
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 90px;
        }

        .lw18 {
            font-size: 18px;
            color: #fff;
        }

        .lg24 {
            font-size: 24px;
            color: #5ECBA1;
        }

        .text-green {
            color: #5ECBA1;
        }

        /* ── City Detail ── */
        .city-detail {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .main-stat {
            flex: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0;
            color: #5ECBA1;
        }

        .main-number {
            font-size: clamp(32px, 20cqh, 120px);
            font-weight: 900;
            color: #5ECBA1;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .main-label {
            font-size: clamp(12px, 4.5cqh, 26px);
            font-weight: 900;
            color: #5ECBA1;
            line-height: 1.2;
            margin-top: 0.4em;
        }

        .secondary-stat {
            flex: 2.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0;
            color: #fff;
        }

        .secondary-number {
            font-size: clamp(26px, 14cqh, 90px);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .secondary-label {
            font-size: clamp(12px, 3.8cqh, 20px);
            font-weight: 900;
            color: #fff;
            line-height: 1.2;
            margin-top: 0.4em;
        }

        /* Aggregation Warning */
        .aggregation-warning {
            flex-shrink: 0;
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.5);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 4px;
            font-family: Arial, sans-serif;
            font-size: clamp(10px, 1.8cqh, 13px);
            color: #ffc107;
            line-height: 1.4;
            text-align: left;
        }

        /* Detail Link */
        .detail-link {
            display: inline-block;
            font-family: Arial, sans-serif;
            font-size: clamp(10px, 2cqh, 14px);
            color: #5ECBA1;
            text-decoration: underline;
            margin-top: 0.4em;
            cursor: pointer;
        }

        .secondary-stat a.detail-link {
            color: #fff;
        }

        .detail-link:hover {
            color: #7EDBB5;
        }

        .detail-link.white {
            color: #fff;
        }

        .detail-link.white:hover {
            color: #ccc;
        }

        /* Detail Modal */
        .detail-modal-content {
            max-width: 700px;
        }

        .detail-modal-title {
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 24px;
            color: #5ECBA1;
            margin-bottom: 20px;
        }

        .detail-modal-formula {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #fff;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .detail-modal-source {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #ccc;
        }

        .detail-modal-source a {
            color: #5ECBA1;
            word-break: break-all;
        }

        .detail-modal-source a:hover {
            color: #7EDBB5;
        }

        /* Results Table */
        .table-scroll-container {
            overflow-x: auto;
            margin-top: 10px;
        }

        .results-table {
            width: 100%;
            min-width: 500px;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .results-table th,
        .results-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .results-table th {
            color: #5ECBA1;
            font-weight: bold;
            font-size: 12px;
        }

        .results-table td {
            color: #fff;
        }

        .results-table tr:last-child td {
            border-bottom: none;
        }

        .results-table tr:hover td {
            background: rgba(94, 203, 161, 0.1);
        }

        /* CTA Button Section */
        .cta-section {
            flex: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .cta-button {
            display: inline-block;
            background: white;
            color: black;
            font-family: 'Folsom', Impact, sans-serif;
            font-size: clamp(14px, 4cqh, 32px);
            font-weight: 900;
            text-decoration: underline;
            padding: 0.65em 1.2em;
            border-radius: 12px;
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.3s;
            line-height: 1.2;
        }

        .cta-button:hover {
            background: #5ECBA1;
            color: black;
        }

        .cta-button .emoji {
            font-style: normal;
            margin-left: 10px;
        }

        /* Explanation Sections */
        .explanation-section {
            margin: 50px 0;
            text-align: left;
            padding: 0 20px;
        }

        .explanation-text {
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #5ECBA1;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .explanation-section.white .explanation-text {
            color: #fff;
        }

        .source-link {
            display: block;
            text-align: right;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #5ECBA1;
            text-decoration: underline;
            word-break: break-all;
        }

        .explanation-section.white .source-link {
            color: #fff;
        }

        .source-link:hover {
            color: #7EDBB5;
        }

        .explanation-section.white .source-link:hover {
            color: #ccc;
        }

        .loading {
            color: #5ECBA1;
            font-family: Arial, sans-serif;
            font-size: 18px;
            padding: 40px;
        }

        .error {
            color: #ff6b6b;
            font-family: Arial, sans-serif;
            font-size: 18px;
            padding: 40px;
        }

        .hidden {
            display: none;
        }

        /* ── Access Gate ── */
        .access-gate {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .access-gate.show {
            display: flex;
        }

        .access-gate-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 40px;
        }

        .access-gate-input {
            background: #1a1a1a;
            border: 2px solid #5ECBA1;
            border-radius: 10px;
            padding: 15px 25px;
            font-family: Arial, sans-serif;
            font-size: 20px;
            color: #fff;
            text-align: center;
            width: 200px;
            outline: none;
        }

        .access-gate-input:focus {
            border-color: #7EDBB5;
        }

        .access-gate-input::placeholder {
            color: #666;
        }

        .access-gate-button {
            margin-top: 20px;
            background: #5ECBA1;
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 20px;
            color: #000;
            cursor: pointer;
            transition: background 0.3s;
        }

        .access-gate-button:hover {
            background: #7EDBB5;
        }

        .access-error {
            display: none;
            color: #ff6b6b;
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin-top: 15px;
        }

        /* ── Modal ── */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: #5ECBA1;
        }

        /* Qomon Form Styles */
        .qomon-form input,
        .qomon-form textarea,
        .qomon-form select {
            color: #000 !important;
            background-color: #fff !important;
        }

        .qomon-form input::placeholder {
            color: #666 !important;
        }

        /* Share Modal Styles */
        .share-modal-content {
            text-align: center;
            max-width: 400px;
        }

        .share-modal-title {
            font-family: 'Folsom', Impact, sans-serif;
            font-size: 36px;
            color: #5ECBA1;
            margin-bottom: 10px;
        }

        .share-modal-subtitle {
            font-family: Arial, sans-serif;
            font-size: 18px;
            color: #ccc;
            margin-bottom: 25px;
        }

        .share-modal-image-container {
            margin: 20px 0;
        }

        .share-modal-image {
            max-width: 100%;
            max-height: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(94, 203, 161, 0.3);
        }

        .share-download-button {
            display: inline-block;
            margin-top: 20px;
            font-size: 24px;
            padding: 20px 40px;
        }

        /* Footer Styles */
        .footer {
            text-align: center;
            padding: 10px 20px;
            border-top: 1px solid #333;
            margin-top: 0;
        }

        .footer a {
            color: #666;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-decoration: none;
        }

        .footer a:hover {
            color: #5ECBA1;
        }
    </style>
</head>
<body>
    <!-- Access Gate -->
    <div id="accessGate" class="access-gate">
        <h1 class="access-gate-title">#RIENSANSNOUS</h1>
        <input type="text" id="accessCodeInput" class="access-gate-input" placeholder="Code d'accès" autocomplete="off">
        <button type="button" id="accessCodeSubmit" class="access-gate-button">Valider</button>
        <p id="accessError" class="access-error"></p>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <nav class="navbar">
            <a id="navBrand" class="navbar-brand" href="/">#RIENSANSNOUS</a>
            <img src="/assets/LogoOEP.png" alt="On Est Prêt" class="navbar-logo">
            <div></div>
        </nav>

        <div class="container">
            <div class="search-box">
                <label class="search-input-wrapper" for="searchInput">
                    <input type="text" id="searchInput" class="search-input" placeholder="RENTRE TA VILLE">
                </label>
                <div id="results" class="results"></div>
            </div>

            <div id="landingText" class="landing-text">
                <p>Rentre le nom de ta ville et<br>découvre combien de jeunes<br>auraient pu <span class="text-green">faire la diff'</span><br>aux municipales de 2020.</p>
                <p><span class="lw18">En 2026,</span> <span class="lg24">RIEN</span><br><span class="lw18">NE DOIT SE DÉCIDER</span><br><span class="lg24">SANS LA JEUNESSE</span></p>
            </div>

            <div id="cityDetail"></div>
        </div>

        <footer class="footer">
            <a href="/mentions-legales.html">Mentions légales</a>
        </footer>
    </div>

    <script src="https://scripts.qomon.org/forms/v1/setup.js"></script>
    <script src="app.js"></script>

</body>
</html>
